services:
  timestral:
    build: ./service
    platform: linux/amd64
    environment:
      TIMESTRAL_MODEL: ${TIMESTRAL_MODEL:-5M}
      TORCH_NUM_THREADS: "4"
    volumes:
      - model-cache:/cache
    cpus: 4
    mem_limit: 8g
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  grafana:
    build:
      context: .
      dockerfile: demo/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: antoinerrr-timestral-datasource
      GF_PATHS_PLUGINS: /opt/grafana/plugins
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/timestral.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      timestral:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  model-cache:
  grafana-data:
